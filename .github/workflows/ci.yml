name: .NET CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  validate:
    name: .NET (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore AIKernel.Doom.slnx
      - name: Build
        id: build
        run: dotnet build AIKernel.Doom.slnx -c Release --no-restore
      - name: Test
        run: dotnet test AIKernel.Doom.slnx -c Release --no-build --no-restore
      - name: Pack
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet pack AIKernel.Doom.slnx -c Release --no-build --no-restore
